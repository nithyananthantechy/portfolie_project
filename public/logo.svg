<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5c4"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <filter id="logoFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Emblem Left -->
  <g transform="translate(10, 8)">
    <polygon points="32,4 60,19 60,49 32,64 4,49 4,19" 
             fill="rgba(0, 245, 196, 0.08)" 
             stroke="url(#logoGlow)" 
             stroke-width="2.5" 
             stroke-linejoin="round"
             filter="url(#logoFilter)" />

    <path d="M20,48 L20,20 L44,48 L44,20" 
          fill="none" 
          stroke="url(#logoGlow)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="32" cy="4" r="2.5" fill="#00f5c4" />
    <circle cx="60" cy="19" r="2.5" fill="#00d4ff" />
    <circle cx="60" cy="49" r="2.5" fill="#6c63ff" />
    <circle cx="32" cy="64" r="2.5" fill="#6c63ff" />
    <circle cx="4" cy="49" r="2.5" fill="#00d4ff" />
    <circle cx="4" cy="19" r="2.5" fill="#00f5c4" />
  </g>

  <!-- Typography Right -->
  <text x="88" y="38" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2.5">
    NSK GROUPS
  </text>
  <text x="90" y="55" font-family="'Rajdhani', sans-serif" font-size="11" font-weight="700" fill="#00f5c4" letter-spacing="3.2">
    TECHNOLOGY HOLDING // CMD
  </text>
</svg>
