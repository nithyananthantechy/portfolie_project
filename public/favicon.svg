<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5c4"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark cyber background container -->
  <rect width="128" height="128" rx="28" fill="#030712" />
  
  <!-- Outer Hexagonal / Shield Border -->
  <polygon points="64,12 116,40 116,88 64,116 12,88 12,40" 
           fill="rgba(0, 245, 196, 0.05)" 
           stroke="url(#cyberGlow)" 
           stroke-width="3.5" 
           stroke-linejoin="round"
           filter="url(#neonBlur)" />

  <!-- Inner Tech Nodes & Lines -->
  <line x1="64" y1="12" x2="64" y2="34" stroke="#00f5c4" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="64" y1="94" x2="64" y2="116" stroke="#6c63ff" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>
  
  <!-- Central Stylized N / NSK Emblem -->
  <path d="M42,88 L42,40 L86,88 L86,40" 
        fill="none" 
        stroke="url(#cyberGlow)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonBlur)" />
        
  <!-- Corner Quantum Dots -->
  <circle cx="64" cy="12" r="3.5" fill="#00f5c4" />
  <circle cx="116" cy="40" r="3.5" fill="#00d4ff" />
  <circle cx="116" cy="88" r="3.5" fill="#6c63ff" />
  <circle cx="64" cy="116" r="3.5" fill="#6c63ff" />
  <circle cx="12" cy="88" r="3.5" fill="#00d4ff" />
  <circle cx="12" cy="40" r="3.5" fill="#00f5c4" />
</svg>
